[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order and bugbear
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
# every part imports its own modules by name
known-local-folder = ["utils", "model", "functions", "conll", "helpers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
