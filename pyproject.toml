[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "natural-language-processing"
version = "2.0.0"
description = "Can we trust an ablation study? An audit of two incremental NLP studies: LSTM language models on Penn Treebank and joint intent classification and slot filling on ATIS"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Giampietro" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "scikit-learn>=1.2",
    "tqdm",
    "matplotlib",
    "transformers>=4.30",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.3"]

[project.scripts]
nlp-lm = "nlp.lm.cli:main"
nlp-slu = "nlp.slu.cli:main"

[tool.setuptools.packages.find]
include = ["nlp*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order and bugbear
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["nlp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
