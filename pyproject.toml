[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nlu-ablations"
version = "2.0.0"
description = "Incremental ablation studies on language modelling (Penn Treebank) and joint intent classification and slot filling (ATIS), from LSTMs to BERT"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Andrea Giampietro" }]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy",
    "scipy",
    "scikit-learn>=1.2",
    "tqdm",
    "matplotlib",
    "transformers>=4.30",
]

[project.optional-dependencies]
dev = ["pytest", "ruff==0.17.3"]

[project.scripts]
nlu-lm = "nlu_ablations.lm.cli:main"
nlu-slu = "nlu_ablations.slu.cli:main"

[tool.setuptools.packages.find]
include = ["nlu_ablations*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
# pyflakes, pycodestyle, import order and bugbear
select = ["E", "F", "W", "I", "B"]

[tool.ruff.lint.isort]
known-first-party = ["nlu_ablations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
